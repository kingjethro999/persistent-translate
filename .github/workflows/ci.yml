name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Immutable commit to validate for release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm scan:secrets
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test scripts/*.test.mjs
      - run: pnpm audit:dependencies
      - run: pnpm build:chrome
      - run: pnpm build:firefox
      - run: pnpm verify:manifests
      - run: pnpm lint:firefox
      - name: Package production builds
        run: |
          pnpm zip:chrome
          pnpm zip:firefox
          pnpm verify:manifests
          node scripts/create-source-archive.mjs
          pnpm verify:packages --require-source
      - name: Install real Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Persistent translation browser tests
        run: xvfb-run -a pnpm test:e2e:chrome
      - name: Upload audited unsigned artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-extension-packages
          path: |
            .output/*.zip
            .output/SHA256SUMS
            .output/permission-inventory.json
            .output/build-provenance.json
          if-no-files-found: error
          include-hidden-files: true # Audited allowlist lives in the hidden .output directory.
          retention-days: 7
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chromium-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  history-secrets:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
